name: Deploy Helm component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      grafana_dashboard_artifact:
        required: false
        type: string
        default: ""
    outputs:
      image_tag:
        description: Immutable image tag deployed by this component.
        value: ${{ jobs.deploy.outputs.image_tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ inputs.image_tag }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      GKE_NAMESPACE: ${{ vars.GKE_NAMESPACE }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      GCP_WORKLOAD_SERVICE_ACCOUNT: ${{ vars.GCP_WORKLOAD_SERVICE_ACCOUNT }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      EVALUATION_ARTIFACT_BUCKET: ${{ vars.EVALUATION_ARTIFACT_BUCKET }}
      ELASTICSEARCH_ENDPOINT: ${{ vars.ELASTICSEARCH_ENDPOINT }}
      ELASTICSEARCH_USERNAME: ${{ vars.ELASTICSEARCH_USERNAME }}
      API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
      KESTRA_BASIC_AUTH_USERNAME: ${{ vars.KESTRA_BASIC_AUTH_USERNAME }}
      KESTRA_PUBLIC_IP: ${{ vars.KESTRA_PUBLIC_IP }}
      NATS_UI_PUBLIC_IP: ${{ vars.NATS_UI_PUBLIC_IP }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up deployment access
        uses: ./.github/actions/setup-deployment
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Download generated Grafana dashboards
        if: ${{ inputs.grafana_dashboard_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.grafana_dashboard_artifact }}
          path: infra/helm/foodmind/files/grafana

      - name: Deploy ${{ inputs.component }}
        run: infra/helm/deploy.sh ${{ inputs.component }}
