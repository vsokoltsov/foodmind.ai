name: Deploy Terraform component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      kestra_image_tag:
        required: false
        type: string
        default: ""
    outputs:
      image_tag:
        description: Immutable image tag deployed by this component.
        value: ${{ jobs.deploy.outputs.image_tag }}
      kestra_image_tag:
        description: Content-addressed Kestra runtime image tag.
        value: ${{ jobs.deploy.outputs.kestra_image_tag }}

jobs:
  deploy:
    if: ${{ vars.GCP_INFRASTRUCTURE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ inputs.image_tag }}
      kestra_image_tag: ${{ inputs.kestra_image_tag != '' && inputs.kestra_image_tag || inputs.image_tag }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
      TF_VAR_namespace: ${{ vars.GKE_NAMESPACE }}
      TF_VAR_component: ${{ inputs.component }}
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      TF_VAR_kestra_image_tag: ${{ inputs.kestra_image_tag != '' && inputs.kestra_image_tag || inputs.image_tag }}
      TF_VAR_artifact_registry_repository: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      TF_VAR_cloud_sql_connection_name: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      TF_VAR_gcp_workload_service_account: ${{ vars.GCP_WORKLOAD_SERVICE_ACCOUNT }}
      TF_VAR_gcs_bucket: ${{ vars.GCS_BUCKET }}
      TF_VAR_evaluation_artifact_bucket: ${{ vars.EVALUATION_ARTIFACT_BUCKET }}
      TF_VAR_elasticsearch_endpoint: ${{ vars.ELASTICSEARCH_ENDPOINT }}
      TF_VAR_elasticsearch_username: ${{ vars.ELASTICSEARCH_USERNAME }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_kestra_basic_auth_username: ${{ vars.KESTRA_BASIC_AUTH_USERNAME }}
      TF_VAR_kestra_public_ip: ${{ vars.KESTRA_PUBLIC_IP }}
      TF_VAR_nats_ui_public_ip: ${{ vars.NATS_UI_PUBLIC_IP }}
      TF_VAR_runtime_secret_revision: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Read bootstrap runtime secrets
        id: runtime-secrets
        if: ${{ inputs.component == 'bootstrap' || inputs.component == 'all' }}
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            openai_api_key:${{ vars.GCP_PROJECT_ID }}/OPENAI_API_KEY
            foodmind_database_password:${{ vars.GCP_PROJECT_ID }}/FOODMIND_DATABASE_PASSWORD
            kestra_database_password:${{ vars.GCP_PROJECT_ID }}/KESTRA_DATABASE_PASSWORD
            kestra_basic_auth_password:${{ vars.GCP_PROJECT_ID }}/KESTRA_BASIC_AUTH_PASSWORD
            elasticsearch_password:${{ vars.GCP_PROJECT_ID }}/ELASTICSEARCH_PASSWORD

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      # This job compiles the dashboard itself so Grafana can deploy in
      # parallel with the dashboard-validation job in the caller workflow.
      - name: Install Jsonnet
        if: ${{ inputs.component == 'grafana' }}
        run: sudo apt-get update && sudo apt-get install --yes jsonnet

      - name: Generate Grafana dashboards
        if: ${{ inputs.component == 'grafana' }}
        run: make grafana-dashboards

      - name: Initialize component state
        working-directory: infra/deployment
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}"
          -backend-config="prefix=deploy/${{ inputs.component }}"

      - name: Validate deployment configuration
        working-directory: infra/deployment
        run: terraform validate

      - name: Plan ${{ inputs.component }}
        working-directory: infra/deployment
        env: &runtime-secrets
          TF_VAR_openai_api_key: ${{ steps.runtime-secrets.outputs.openai_api_key }}
          TF_VAR_foodmind_database_password: ${{ steps.runtime-secrets.outputs.foodmind_database_password }}
          TF_VAR_kestra_database_password: ${{ steps.runtime-secrets.outputs.kestra_database_password }}
          TF_VAR_kestra_basic_auth_password: ${{ steps.runtime-secrets.outputs.kestra_basic_auth_password }}
          TF_VAR_elasticsearch_password: ${{ steps.runtime-secrets.outputs.elasticsearch_password }}
        run: terraform plan -out=deployment.tfplan

      - name: Apply ${{ inputs.component }}
        working-directory: infra/deployment
        env: *runtime-secrets
        run: terraform apply -auto-approve deployment.tfplan
