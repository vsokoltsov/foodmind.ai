name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.check }}

  tests:
    name: ${{ matrix.suite }} tests
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.suite }}

  evaluation:
    name: ${{ matrix.agent }} ${{ matrix.agent == 'retrieval' && 'retrieval' || 'LLM' }} evaluation
    needs: tests
    # Secret Manager access is intentionally unavailable to forked pull requests.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Model roles are configured through the typed nested settings fields. The
    # checked-in app/models.yaml contains the same defaults; these values make
    # the CI selection explicit and reproducible.
    env:
      MODELS__QUERY_REWRITER__PROVIDER: vertex
      MODELS__QUERY_REWRITER__MODEL: gemini-2.5-flash-lite
      MODELS__PLANNER__PROVIDER: vertex
      MODELS__PLANNER__MODEL: gemini-2.5-flash
      MODELS__AGENT__PROVIDER: openai
      MODELS__AGENT__MODEL: gpt-4.1-mini
      MODELS__SYNTHESIS__PROVIDER: vertex
      MODELS__SYNTHESIS__MODEL: gemini-2.5-flash-lite
      MODELS__EVALUATION_JUDGE__PROVIDER: openai
      MODELS__EVALUATION_JUDGE__MODEL: gpt-5-mini
      MODELS__EMBEDDINGS__PROVIDER: vertex
      MODELS__EMBEDDINGS__MODEL: gemini-embedding-001
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: food-search
            target: evaluation-food-search
          - agent: retrieval
            target: evaluation-retrieval
          - agent: nutrition-analysis
            target: evaluation-nutrition-analysis
          - agent: product-comparison
            target: evaluation-product-comparison
          - agent: food-recommendation
            target: evaluation-food-recommendation
          - agent: orchestrator
            target: evaluation-orchestrator
          - agent: planner
            target: evaluation-planner
          - agent: executor
            target: evaluation-executor
    permissions:
      contents: read
      id-token: write
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Load OpenAI API key from Secret Manager
        run: |
          OPENAI_KEY="$(gcloud secrets versions access latest --secret=OPENAI_API_KEY --project=${{ vars.GCP_PROJECT_ID }})"
          echo "::add-mask::$OPENAI_KEY"
          echo "OPENAI_API_KEY=$OPENAI_KEY" >> "$GITHUB_ENV"
          unset OPENAI_KEY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run ${{ matrix.agent }} evaluation
        env:
          ELASTICSEARCH_URL: http://localhost:9200
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          EVALUATION_ARTIFACT_BUCKET: ${{ vars.EVALUATION_ARTIFACT_BUCKET }}
        run: make ${{ matrix.target }}

  deploy:
    name: Build and deploy Helm release
    needs: [quality, tests, evaluation]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      GKE_NAMESPACE: ${{ vars.GKE_NAMESPACE }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      GCP_WORKLOAD_SERVICE_ACCOUNT: ${{ vars.GCP_WORKLOAD_SERVICE_ACCOUNT }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      EVALUATION_ARTIFACT_BUCKET: ${{ vars.EVALUATION_ARTIFACT_BUCKET }}
      ELASTICSEARCH_ENDPOINT: ${{ vars.ELASTICSEARCH_ENDPOINT }}
      ELASTICSEARCH_USERNAME: ${{ vars.ELASTICSEARCH_USERNAME }}
      API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: azure/setup-helm@v4

      - name: Install Jsonnet
        run: sudo apt-get update && sudo apt-get install --yes jsonnet

      - name: Load runtime secrets from Secret Manager
        shell: bash
        run: |
          for secret_name in OPENAI_API_KEY FOODMIND_DATABASE_PASSWORD KESTRA_DATABASE_PASSWORD ELASTICSEARCH_PASSWORD; do
            secret_value="$(gcloud secrets versions access latest --secret="${secret_name}" --project="${GCP_PROJECT_ID}")"
            echo "::add-mask::${secret_value}"
            echo "${secret_name}=${secret_value}" >> "${GITHUB_ENV}"
          done

      - name: Build and push backend images
        run: infra/deploy/build-images.sh

      - name: Install application dependencies
        run: uv sync --frozen --no-dev

      - name: Deploy the Helm release
        run: infra/helm/deploy.sh
