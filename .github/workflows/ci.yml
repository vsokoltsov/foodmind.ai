name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.check }}

  tests:
    name: ${{ matrix.suite }} tests
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.suite }}

  evaluation:
    name: ${{ matrix.agent }} LLM evaluation
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: food-search
            target: evaluation-food-search
          - agent: nutrition-analysis
            target: evaluation-nutrition-analysis
          - agent: product-comparison
            target: evaluation-product-comparison
          - agent: food-recommendation
            target: evaluation-food-recommendation
          - agent: orchestrator
            target: evaluation-orchestrator
          - agent: planner
            target: evaluation-planner
          - agent: executor
            target: evaluation-executor
    # Forked pull requests receive an empty value and skip the evaluation step.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run ${{ matrix.agent }} LLM-as-judge evaluation
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: make ${{ matrix.target }}
