name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.check }}

  tests:
    name: ${{ matrix.suite }} tests
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.suite }}

  evaluation:
    name: ${{ matrix.agent }} ${{ matrix.agent == 'retrieval' && 'retrieval' || 'LLM' }} evaluation
    needs: tests
    # Secret Manager access is intentionally unavailable to forked pull requests.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Model roles are configured through the typed nested settings fields. The
    # checked-in app/models.yaml contains the same defaults; these values make
    # the CI selection explicit and reproducible.
    env:
      MODELS__QUERY_REWRITER__PROVIDER: vertex
      MODELS__QUERY_REWRITER__MODEL: gemini-2.5-flash-lite
      MODELS__PLANNER__PROVIDER: vertex
      MODELS__PLANNER__MODEL: gemini-2.5-flash
      MODELS__AGENT__PROVIDER: openai
      MODELS__AGENT__MODEL: gpt-4.1-mini
      MODELS__SYNTHESIS__PROVIDER: vertex
      MODELS__SYNTHESIS__MODEL: gemini-2.5-flash-lite
      MODELS__EVALUATION_JUDGE__PROVIDER: openai
      MODELS__EVALUATION_JUDGE__MODEL: gpt-5-mini
      MODELS__EMBEDDINGS__PROVIDER: vertex
      MODELS__EMBEDDINGS__MODEL: gemini-embedding-001
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: food-search
            target: evaluation-food-search
          - agent: retrieval
            target: evaluation-retrieval
          - agent: nutrition-analysis
            target: evaluation-nutrition-analysis
          - agent: product-comparison
            target: evaluation-product-comparison
          - agent: food-recommendation
            target: evaluation-food-recommendation
          - agent: orchestrator
            target: evaluation-orchestrator
          - agent: planner
            target: evaluation-planner
          - agent: executor
            target: evaluation-executor
    permissions:
      contents: read
      id-token: write
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Load OpenAI API key from Secret Manager
        run: |
          OPENAI_KEY="$(gcloud secrets versions access latest --secret=OPENAI_API_KEY --project=${{ vars.GCP_PROJECT_ID }})"
          echo "::add-mask::$OPENAI_KEY"
          echo "OPENAI_API_KEY=$OPENAI_KEY" >> "$GITHUB_ENV"
          unset OPENAI_KEY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run ${{ matrix.agent }} evaluation
        env:
          ELASTICSEARCH_URL: http://localhost:9200
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          EVALUATION_ARTIFACT_BUCKET: ${{ vars.EVALUATION_ARTIFACT_BUCKET }}
        run: make ${{ matrix.target }}

  changes:
    name: Detect release-relevant changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            release:
              - 'app/**'
              - 'cmd/**'
              - 'infra/kestra/**'
              - 'infra/helm/**'
              - 'Dockerfile.api'
              - 'Dockerfile.kestra'
              - 'Dockerfile.ui'
              - 'pyproject.toml'
              - 'uv.lock'

  build-images:
    name: Build images
    needs: [quality, tests, evaluation]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image-metadata.outputs.image_tag }}
      image_artifact: ${{ steps.image-metadata.outputs.image_artifact }}
    env:
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: image-metadata
        name: Define image metadata
        run: |
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_artifact=foodmind-images-${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes the GitHub cache service credentials needed by direct
      # `docker buildx build --cache-to/from type=gha` invocations.
      - name: Expose GitHub Actions cache service
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build images
        run: infra/deploy/build-images.sh build

      - name: Export images
        run: |
          docker save \
            "${ARTIFACT_REGISTRY_REPOSITORY}/api:${IMAGE_TAG}" \
            "${ARTIFACT_REGISTRY_REPOSITORY}/kestra:${IMAGE_TAG}" \
            "${ARTIFACT_REGISTRY_REPOSITORY}/ui:${IMAGE_TAG}" \
            "${ARTIFACT_REGISTRY_REPOSITORY}/ui:latest" \
            -o foodmind-images.tar

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image-metadata.outputs.image_artifact }}
          path: foodmind-images.tar
          compression-level: 0
          retention-days: 1

  push-images:
    name: Push images
    needs: [build-images, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ needs.build-images.outputs.image_tag }}
    env:
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-images.outputs.image_artifact }}

      - name: Import images
        run: docker load --input foodmind-images.tar

      - name: Push images
        run: infra/deploy/build-images.sh push

  deploy-bootstrap:
    name: Deploy bootstrap and database migrations
    needs: [push-images, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: bootstrap
      image_tag: ${{ needs.push-images.outputs.image_tag }}
    secrets: inherit

  deploy-nats:
    name: Deploy NATS
    needs: [deploy-bootstrap, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: nats
      image_tag: ${{ needs.deploy-bootstrap.outputs.image_tag }}
    secrets: inherit

  deploy-observability:
    name: Deploy Prometheus and Tempo
    needs: [deploy-nats, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: observability
      image_tag: ${{ needs.deploy-nats.outputs.image_tag }}
    secrets: inherit

  prepare-grafana-dashboards:
    name: Prepare Grafana dashboards
    needs: [deploy-observability, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.deploy-observability.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Jsonnet
        run: sudo apt-get update && sudo apt-get install --yes jsonnet
      - name: Generate dashboards
        run: make grafana-dashboards
      - name: Upload generated dashboards
        uses: actions/upload-artifact@v4
        with:
          name: grafana-dashboards-${{ github.sha }}
          path: infra/helm/foodmind/files/grafana/
          retention-days: 1

  deploy-grafana:
    name: Deploy Grafana
    needs: [prepare-grafana-dashboards, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: grafana
      image_tag: ${{ needs.prepare-grafana-dashboards.outputs.image_tag }}
      grafana_dashboard_artifact: grafana-dashboards-${{ github.sha }}
    secrets: inherit

  deploy-kestra:
    name: Deploy Kestra and synchronize flows
    needs: [deploy-grafana, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: kestra
      image_tag: ${{ needs.deploy-grafana.outputs.image_tag }}
    secrets: inherit

  deploy-api:
    name: Deploy API
    needs: [deploy-kestra, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: api
      image_tag: ${{ needs.deploy-kestra.outputs.image_tag }}
    secrets: inherit

  deploy-worker:
    name: Deploy chat worker
    needs: [deploy-api, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: worker
      image_tag: ${{ needs.deploy-api.outputs.image_tag }}
    secrets: inherit

  deploy-ui:
    name: Deploy Cloud Run UI
    needs: [deploy-worker, changes]
    if: ${{ needs.changes.outputs.release == 'true' }}
    uses: ./.github/workflows/deploy-ui.yml
    with:
      image_tag: ${{ needs.deploy-worker.outputs.image_tag }}
    secrets: inherit
