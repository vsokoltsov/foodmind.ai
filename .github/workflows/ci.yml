name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.check }}

  tests:
    name: ${{ matrix.suite }} tests
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.suite }}

  evaluation:
    name: ${{ matrix.agent }} LLM evaluation
    needs: tests
    # Secret Manager access is intentionally unavailable to forked pull requests.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: food-search
            target: evaluation-food-search
          - agent: nutrition-analysis
            target: evaluation-nutrition-analysis
          - agent: product-comparison
            target: evaluation-product-comparison
          - agent: food-recommendation
            target: evaluation-food-recommendation
          - agent: orchestrator
            target: evaluation-orchestrator
          - agent: planner
            target: evaluation-planner
          - agent: executor
            target: evaluation-executor
    permissions:
      contents: read
      id-token: write
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Load OpenAI API key from Secret Manager
        run: |
          OPENAI_KEY="$(gcloud secrets versions access latest --secret=OPENAI_API_KEY --project=${{ vars.GCP_PROJECT_ID }})"
          echo "::add-mask::$OPENAI_KEY"
          echo "OPENAI_API_KEY=$OPENAI_KEY" >> "$GITHUB_ENV"
          unset OPENAI_KEY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run ${{ matrix.agent }} LLM-as-judge evaluation
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: make ${{ matrix.target }}
