name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.check }}

  tests:
    name: ${{ matrix.suite }} tests
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: make ${{ matrix.suite }}

  evaluation:
    name: ${{ matrix.agent }} ${{ matrix.agent == 'retrieval' && 'retrieval' || 'LLM' }} evaluation
    needs: tests
    # Secret Manager access is intentionally unavailable to forked pull requests.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Model roles are configured through the typed nested settings fields. The
    # checked-in app/models.yaml contains the same defaults; these values make
    # the CI selection explicit and reproducible.
    env:
      MODELS__QUERY_REWRITER__PROVIDER: vertex
      MODELS__QUERY_REWRITER__MODEL: gemini-2.5-flash-lite
      MODELS__PLANNER__PROVIDER: vertex
      MODELS__PLANNER__MODEL: gemini-2.5-flash
      MODELS__AGENT__PROVIDER: openai
      MODELS__AGENT__MODEL: gpt-4.1-mini
      MODELS__SYNTHESIS__PROVIDER: vertex
      MODELS__SYNTHESIS__MODEL: gemini-2.5-flash-lite
      MODELS__EVALUATION_JUDGE__PROVIDER: openai
      MODELS__EVALUATION_JUDGE__MODEL: gpt-5-mini
      MODELS__EMBEDDINGS__PROVIDER: vertex
      MODELS__EMBEDDINGS__MODEL: gemini-embedding-001
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: food-search
            target: evaluation-food-search
          - agent: retrieval
            target: evaluation-retrieval
          - agent: nutrition-analysis
            target: evaluation-nutrition-analysis
          - agent: product-comparison
            target: evaluation-product-comparison
          - agent: food-recommendation
            target: evaluation-food-recommendation
          - agent: orchestrator
            target: evaluation-orchestrator
          - agent: planner
            target: evaluation-planner
          - agent: executor
            target: evaluation-executor
    permissions:
      contents: read
      id-token: write
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Load OpenAI API key from Secret Manager
        run: |
          OPENAI_KEY="$(gcloud secrets versions access latest --secret=OPENAI_API_KEY --project=${{ vars.GCP_PROJECT_ID }})"
          echo "::add-mask::$OPENAI_KEY"
          echo "OPENAI_API_KEY=$OPENAI_KEY" >> "$GITHUB_ENV"
          unset OPENAI_KEY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run ${{ matrix.agent }} evaluation
        env:
          ELASTICSEARCH_URL: http://localhost:9200
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          EVALUATION_ARTIFACT_BUCKET: ${{ vars.EVALUATION_ARTIFACT_BUCKET }}
        run: make ${{ matrix.target }}

  build-dependencies:
    name: Build Python dependency image
    needs: [quality, tests, evaluation]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      python_base_image: ${{ steps.image-metadata.outputs.python_base_image }}
      kestra_image_tag: ${{ steps.image-metadata.outputs.kestra_image_tag }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - id: image-metadata
        name: Define content-addressed image tags
        run: |
          dependency_hash="$(sha256sum uv.lock | cut -c1-16)"
          kestra_hash="$(sha256sum Dockerfile.kestra | cut -c1-16)"
          echo "python_base_image=${ARTIFACT_REGISTRY_REPOSITORY}/python-dependencies:${dependency_hash}" >> "$GITHUB_OUTPUT"
          echo "kestra_image_tag=runtime-${kestra_hash}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache service
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and publish dependency image
        env:
          PYTHON_BASE_IMAGE: ${{ steps.image-metadata.outputs.python_base_image }}
          PUSH_DEPENDENCY_IMAGE: "true"
        run: infra/deploy/build-images.sh dependencies

  build-images:
    name: Build and publish ${{ matrix.component }} image
    needs: build-dependencies
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
          - component: kestra
          - component: ingestion
          - component: ui
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      IMAGE_TAG: ${{ matrix.component == 'kestra' && needs.build-dependencies.outputs.kestra_image_tag || github.sha }}
      PYTHON_BASE_IMAGE: ${{ needs.build-dependencies.outputs.python_base_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes the GitHub cache service credentials needed by direct
      # `docker buildx build --cache-to/from type=gha` invocations.
      - name: Expose GitHub Actions cache service
        uses: crazy-max/ghaction-github-runtime@v4

      - id: kestra-image-check
        name: Check whether the Kestra runtime image needs rebuilding
        if: ${{ matrix.component == 'kestra' }}
        shell: bash
        run: |
          if gcloud artifacts docker images describe \
            "${ARTIFACT_REGISTRY_REPOSITORY}/kestra:${IMAGE_TAG}" \
            --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Kestra runtime inputs are unchanged; reusing ${IMAGE_TAG}."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Kestra runtime image ${IMAGE_TAG} is absent and will be built."
          fi

      - name: Build and publish ${{ matrix.component }} image
        if: ${{ matrix.component != 'kestra' || steps.kestra-image-check.outputs.rebuild == 'true' }}
        run: infra/deploy/build-images.sh publish-${{ matrix.component }}

  deploy-bootstrap:
    name: Deploy bootstrap and database migrations
    needs: [build-dependencies, build-images]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: bootstrap
      image_tag: ${{ github.sha }}
      kestra_image_tag: ${{ needs.build-dependencies.outputs.kestra_image_tag }}
    secrets: inherit

  deploy-nats:
    name: Deploy NATS
    needs: deploy-bootstrap
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: nats
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy-observability:
    name: Deploy Prometheus and Tempo
    needs: deploy-bootstrap
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: observability
      image_tag: ${{ github.sha }}
    secrets: inherit

  prepare-grafana-dashboards:
    name: Prepare Grafana dashboards
    needs: deploy-bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Jsonnet
        run: sudo apt-get update && sudo apt-get install --yes jsonnet
      - name: Generate dashboards
        run: make grafana-dashboards
      - name: Upload generated dashboards
        uses: actions/upload-artifact@v4
        with:
          name: grafana-dashboards-${{ github.sha }}
          path: infra/helm/foodmind/files/grafana/
          retention-days: 1

  deploy-grafana:
    name: Deploy Grafana
    needs: deploy-bootstrap
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: grafana
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy-kestra:
    name: Deploy Kestra and synchronize flows
    needs: deploy-bootstrap
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: kestra
      image_tag: ${{ github.sha }}
      kestra_image_tag: ${{ needs.deploy-bootstrap.outputs.kestra_image_tag }}
    secrets: inherit

  deploy-api:
    name: Deploy API
    needs: deploy-bootstrap
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: api
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy-worker:
    name: Deploy chat worker
    needs: deploy-bootstrap
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: worker
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy-ui:
    name: Deploy Cloud Run UI
    needs: deploy-bootstrap
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ui.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
