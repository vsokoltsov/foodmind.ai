name: Set up GKE deployment
description: Authenticate to Google Cloud and load the runtime credentials needed by a Helm component release.

inputs:
  workload_identity_provider:
    required: true
  service_account:
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: gke-gcloud-auth-plugin

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Load runtime secrets from Secret Manager
      shell: bash
      run: |
        for secret_name in OPENAI_API_KEY FOODMIND_DATABASE_PASSWORD KESTRA_DATABASE_PASSWORD KESTRA_BASIC_AUTH_PASSWORD ELASTICSEARCH_PASSWORD; do
          secret_value="$(gcloud secrets versions access latest --secret="${secret_name}" --project="${GCP_PROJECT_ID}")"
          echo "::add-mask::${secret_value}"
          echo "${secret_name}=${secret_value}" >> "${GITHUB_ENV}"
        done
