# Model configuration for each LLM role.
# Credentials are intentionally not stored in this file.

models:
  query_rewriter:
    provider: vertex
    model: gemini-2.5-flash-lite
    timeout_seconds: 15
    max_output_tokens: 256

  planner:
    provider: vertex
    model: gemini-2.5-flash
    timeout_seconds: 30
    max_output_tokens: 512

  agent:
    provider: openai
    model: gpt-4.1-mini
    timeout_seconds: 120
    max_output_tokens: 1024
    usage_limits:
      request_limit: 12
      tool_calls_limit: 4

  synthesis:
    provider: vertex
    model: gemini-2.5-flash-lite
    timeout_seconds: 60
    max_output_tokens: 1536

  evaluation_judge:
    provider: openai
    model: gpt-5-mini
    timeout_seconds: 60
    max_output_tokens: 768

  embeddings:
    provider: vertex
    model: gemini-embedding-001
    timeout_seconds: 30
