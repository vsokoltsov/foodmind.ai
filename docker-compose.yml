services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.4.3}
    environment:
      discovery.type: single-node
      network.host: 0.0.0.0
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  run-migrations:
    image: foodmind-kestra:${KESTRA_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.kestra
      args:
        KESTRA_VERSION: ${KESTRA_VERSION:-latest}
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Alembic stores revision state and applies relational migrations in the
      # application PostgreSQL database. Elasticsearch is handled by the first
      # migration as an external service.
      ALEMBIC_DATABASE_URL: postgresql+psycopg://${APP_POSTGRES_USER:-foodmind}:${APP_POSTGRES_PASSWORD:-foodmind}@app-postgres:5432/${APP_POSTGRES_DB:-foodmind}
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
    entrypoint: ["/opt/foodmind/.venv/bin/alembic", "-c", "/workspace/alembic.ini", "upgrade", "head"]
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.4.3}
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    depends_on:
      run-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  kestra-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KESTRA_POSTGRES_DB:-kestra}
      POSTGRES_USER: ${KESTRA_POSTGRES_USER:-kestra}
      POSTGRES_PASSWORD: ${KESTRA_POSTGRES_PASSWORD:-kestra}
    volumes:
      - kestra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KESTRA_POSTGRES_USER:-kestra} -d ${KESTRA_POSTGRES_DB:-kestra}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB:-foodmind}
      POSTGRES_USER: ${APP_POSTGRES_USER:-foodmind}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-foodmind}
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-foodmind} -d ${APP_POSTGRES_DB:-foodmind}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kestra:
    image: foodmind-kestra:${KESTRA_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.kestra
      args:
        KESTRA_VERSION: ${KESTRA_VERSION:-latest}
    user: root
    command:
      - server
      - standalone
      - --config
      - /etc/kestra/application.yaml
      - --plugins
      - /app/plugins
    env_file: .env
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATABASE_URL: ${KESTRA_DATABASE_URL}
      INGESTION_ARTIFACT_STORAGE: ${INGESTION_ARTIFACT_STORAGE:-local}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_PREFIX: ${GCS_PREFIX:-foodmind/ingestion}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      EVALUATION_ARTIFACT_BUCKET: ${EVALUATION_ARTIFACT_BUCKET:-}
      EVALUATION_ARTIFACT_PREFIX: ${EVALUATION_ARTIFACT_PREFIX:-foodmind/evaluation}
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/gcp/gcp.json
      KESTRA_BASIC_AUTH_USERNAME: ${KESTRA_BASIC_AUTH_USERNAME:-admin@foodmind.local}
      KESTRA_BASIC_AUTH_PASSWORD: ${KESTRA_BASIC_AUTH_PASSWORD:-Foodmind123}
    expose:
      - "8080"
      - "8081"
    volumes:
      - kestra-data:/app/storage
      - kestra-dlt-data:/dlt
      - ./data:/data
      - ./gcp.json:/var/secrets/gcp/gcp.json:ro
      - ./:/workspace:ro
      - ./infra/kestra/application.yaml:/etc/kestra/application.yaml:ro
      - ./infra/kestra/flows:/app/flows:ro
      - /tmp/kestra-wd:/tmp/kestra-wd
    depends_on:
      kestra-postgres:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      run-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    image: foodmind-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATABASE_URL: ${API_DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      app-postgres:
        condition: service_healthy
      run-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  kestra-ui:
    image: nginx:1.29-alpine
    environment:
      KESTRA_BASIC_AUTH_USERNAME: ${KESTRA_BASIC_AUTH_USERNAME:-admin@foodmind.local}
      KESTRA_BASIC_AUTH_PASSWORD: ${KESTRA_BASIC_AUTH_PASSWORD:-Foodmind123}
    entrypoint: ["/opt/foodmind/nginx-entrypoint.sh"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/kestra/nginx-entrypoint.sh:/opt/foodmind/nginx-entrypoint.sh:ro
      - ./infra/kestra/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      kestra:
        condition: service_healthy
    restart: unless-stopped

  kestra-init:
    image: foodmind-kestra:${KESTRA_VERSION:-latest}
    command:
      - flow
      - namespace
      - update
      - --plugins
      - /app/plugins
      - --server
      - http://kestra:8080
      - --user
      - ${KESTRA_BASIC_AUTH_USERNAME:-admin@foodmind.local}:${KESTRA_BASIC_AUTH_PASSWORD:-Foodmind123}
      - foodmind
      - /app/flows
    volumes:
      - ./infra/kestra/flows:/app/flows:ro
    depends_on:
      kestra:
        condition: service_healthy
    restart: "no"

volumes:
  elasticsearch-data:
  kestra-postgres-data:
  app-postgres-data:
  kestra-data:
  kestra-dlt-data:
