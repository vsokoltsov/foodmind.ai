id: ingest_openfoodfacts
namespace: foodmind
description: Download, transform, normalize, stage, and index Open Food Facts.

concurrency:
  limit: 1
  behavior: QUEUE

# Each stage runs in an isolated Kubernetes pod. This is important for Open
# Food Facts: a 13 GiB export can use several GiB of memory while parsing. A
# Kestra server restart now reconnects to the labelled task pod rather than
# starting a second local process against the same dlt pipeline.
tasks:
  - id: download_archive
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT5M
    waitRunning: PT2H
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: download
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts download --openfoodfacts-path /data/openfoodfacts-products.jsonl.gz --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom:
            - secretRef: {name: foodmind-runtime}
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: task-data, mountPath: /data, subPath: data}
            - {name: task-data, mountPath: /dlt, subPath: dlt}
      volumes:
        - {name: task-data, persistentVolumeClaim: {claimName: kestra-task-data}}

  - id: transform_documents
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT5M
    waitRunning: PT12H
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: transform
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts transform --openfoodfacts-path /data/openfoodfacts-products.jsonl.gz --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom:
            - secretRef: {name: foodmind-runtime}
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: task-data, mountPath: /data, subPath: data}
            - {name: task-data, mountPath: /dlt, subPath: dlt}
      volumes:
        - {name: task-data, persistentVolumeClaim: {claimName: kestra-task-data}}

  - id: normalize_documents
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT5M
    waitRunning: PT6H
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: normalize
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts normalize --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom:
            - secretRef: {name: foodmind-runtime}
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: task-data, mountPath: /data, subPath: data}
            - {name: task-data, mountPath: /dlt, subPath: dlt}
      volumes:
        - {name: task-data, persistentVolumeClaim: {claimName: kestra-task-data}}

  - id: load_staging_database
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    # A 4 GiB request intentionally requires a second node when the
    # application node is occupied. GKE autoscaling can take several minutes,
    # so do not delete the pending pod before the autoscaler can schedule it.
    waitUntilRunning: PT15M
    waitRunning: PT6H
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: load
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts load --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom:
            - secretRef: {name: foodmind-runtime}
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            # dlt's DuckDB load can hold a large normalized package while it
            # writes the staging database. The request must equal the peak
            # allocation: Kubernetes schedules from requests, not limits. This
            # lets the GKE autoscaler provision a separate node instead of
            # overcommitting the node that runs the API and Kestra.
            requests: {cpu: 250m, memory: 4Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: task-data, mountPath: /data, subPath: data}
            - {name: task-data, mountPath: /dlt, subPath: dlt}
      volumes:
        - {name: task-data, persistentVolumeClaim: {claimName: kestra-task-data}}

  - id: index_elasticsearch
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT5M
    waitRunning: PT6H
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: index
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts index --batch-size 500 --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom:
            - secretRef: {name: foodmind-runtime}
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: task-data, mountPath: /data, subPath: data}
            - {name: task-data, mountPath: /dlt, subPath: dlt}
      volumes:
        - {name: task-data, persistentVolumeClaim: {claimName: kestra-task-data}}

  - id: validate_counts
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT5M
    waitRunning: PT30M
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: validate
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts validate --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom:
            - secretRef: {name: foodmind-runtime}
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: task-data, mountPath: /data, subPath: data}
            - {name: task-data, mountPath: /dlt, subPath: dlt}
      volumes:
        - {name: task-data, persistentVolumeClaim: {claimName: kestra-task-data}}
