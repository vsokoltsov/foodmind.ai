id: ingest_openfoodfacts
namespace: foodmind
description: Persist Open Food Facts as durable GCS Parquet, then index Elasticsearch.

concurrency:
  limit: 1
  behavior: QUEUE

# Each task has its own pod and restores source data from GCS. Parquet is the
# durable checkpoint: a retry counts the completed files and skips their input
# batches. No task pod mounts Kestra's ReadWriteOnce PVC, so it can schedule on
# any cluster node.
tasks:
  - id: download_archive
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT15M
    waitRunning: PT2H
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: download
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts download
              --openfoodfacts-path /data/openfoodfacts-products.jsonl.gz
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: source-data, mountPath: /data}
            - {name: dlt-state, mountPath: /dlt}
      volumes:
        - {name: source-data, emptyDir: {sizeLimit: 20Gi}}
        - {name: dlt-state, emptyDir: {sizeLimit: 1Gi}}

  - id: process_parquet_batches
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT15M
    waitRunning: PT12H
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: parquet
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts process
              --source-batch-size 2000
              --openfoodfacts-path /data/openfoodfacts-products.jsonl.gz
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: source-data, mountPath: /data}
            - {name: dlt-state, mountPath: /dlt}
      volumes:
        - {name: source-data, emptyDir: {sizeLimit: 20Gi}}
        - {name: dlt-state, emptyDir: {sizeLimit: 1Gi}}

  - id: index_elasticsearch
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT15M
    waitRunning: PT6H
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: index
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts index
              --batch-size 500
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: source-data, mountPath: /data}
            - {name: dlt-state, mountPath: /dlt}
      volumes:
        - {name: source-data, emptyDir: {sizeLimit: 20Gi}}
        - {name: dlt-state, emptyDir: {sizeLimit: 1Gi}}

  - id: validate_counts
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT15M
    waitRunning: PT30M
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: validate
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts validate
              --batch-size 500
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: source-data, mountPath: /data}
            - {name: dlt-state, mountPath: /dlt}
      volumes:
        - {name: source-data, emptyDir: {sizeLimit: 20Gi}}
        - {name: dlt-state, emptyDir: {sizeLimit: 1Gi}}
