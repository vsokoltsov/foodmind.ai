id: ingest_openfoodfacts
namespace: foodmind
description: Persist Open Food Facts as durable GCS Parquet, then index Elasticsearch.

concurrency:
  limit: 1
  behavior: QUEUE

# Each task has its own pod. Source bytes, generation manifests, normalized
# Parquet, and Elasticsearch progress are all durable in GCS. No task mounts
# Kestra's ReadWriteOnce PVC, so it can schedule on any cluster node.
tasks:
  - id: download_archive
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT30M
    waitRunning: PT2H
    retry: {type: constant, interval: PT1M, maxAttempts: 3}
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: download
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts download
              --openfoodfacts-path /data/openfoodfacts-products.jsonl.gz
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
            limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 3Gi}
          volumeMounts: [{name: dlt-state, mountPath: /dlt}]
      volumes:
        - {name: dlt-state, emptyDir: {sizeLimit: 1Gi}}

  - id: process_parquet_batches
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT30M
    waitRunning: PT12H
    retry: {type: constant, interval: PT2M, maxAttempts: 3}
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: parquet
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts process
              --source-batch-size 25000
              --openfoodfacts-path /data/openfoodfacts-products.jsonl.gz
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 750m, memory: 2Gi, ephemeral-storage: 2Gi}
            limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 6Gi}
          volumeMounts: [{name: dlt-state, mountPath: /dlt}]
      volumes:
        - {name: dlt-state, emptyDir: {sizeLimit: 2Gi}}

  - id: index_elasticsearch
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT30M
    waitRunning: PT6H
    retry: {type: constant, interval: PT1M, maxAttempts: 3}
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: index
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts index
              --batch-size 1000
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi}
            limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 4Gi}
          volumeMounts: [{name: dlt-state, mountPath: /dlt}]
      volumes:
        - {name: dlt-state, emptyDir: {sizeLimit: 1Gi}}

  - id: validate_counts
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT30M
    waitRunning: PT2H
    # Validation failures are deterministic; retrying cannot change the candidate.
    retry: {type: constant, interval: PT1M, maxAttempts: 1}
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: openfoodfacts
        foodmind.io/stage: validate
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cd /workspace && python /workspace/cmd/ingestion.py stage openfoodfacts validate
              --batch-size 1000
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi}
            limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}
          volumeMounts: [{name: dlt-state, mountPath: /dlt}]
      volumes:
        - {name: dlt-state, emptyDir: {sizeLimit: 1Gi}}
