id: ingest_wikidata
namespace: foodmind
description: Run Wikidata staging and indexing in one isolated Kubernetes pod.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: wikidata_pipeline
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT30M
    waitRunning: PT6H
    retry: {type: constant, interval: PT2M, maxAttempts: 3}
    metadata:
      labels:
        app.kubernetes.io/component: foodmind-ingestion
        foodmind.io/source: wikidata
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              run_stage() {
                python /workspace/cmd/ingestion.py stage wikidata "$1" \
                  --wikidata-batch-size 100 \
                  --pipelines-dir /dlt/pipelines \
                  --staging-dir /dlt/staging
              }
              run_stage extract-base
              run_stage normalize-base
              run_stage load-base
              run_stage extract-details
              run_stage normalize-details
              run_stage load-details
              run_stage transform
              run_stage normalize-final
              run_stage load-final
              run_stage index
              run_stage validate
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          resources:
            requests: {cpu: 750m, memory: 2Gi, ephemeral-storage: 2Gi}
            limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 6Gi}
          volumeMounts: [{name: state, mountPath: /dlt}]
      volumes: [{name: state, emptyDir: {sizeLimit: 4Gi}}]
