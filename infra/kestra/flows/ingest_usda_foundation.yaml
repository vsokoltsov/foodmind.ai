id: ingest_usda_foundation
namespace: foodmind
description: Persist USDA Foundation Foods as durable GCS Parquet, then index Elasticsearch.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: usda_foundation_pipeline
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: download_archive
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - >-
            cd /workspace && python /workspace/cmd/ingestion.py stage usda-foundation download
            --foundation-path /data/foundations.json.zip
            --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging

      - id: process_parquet_batches
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - >-
            cd /workspace && python /workspace/cmd/ingestion.py stage usda-foundation process
            --source-batch-size 2000
            --foundation-path /data/foundations.json.zip
            --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging

      - id: index_elasticsearch
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - >-
            cd /workspace && python /workspace/cmd/ingestion.py stage usda-foundation index
            --batch-size 500
            --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging

      - id: validate_counts
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - >-
            cd /workspace && python /workspace/cmd/ingestion.py stage usda-foundation validate
            --batch-size 500
            --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging

pluginDefaults:
  - type: io.kestra.plugin.scripts.shell.Commands
    values:
      taskRunner:
        type: io.kestra.plugin.core.runner.Process
