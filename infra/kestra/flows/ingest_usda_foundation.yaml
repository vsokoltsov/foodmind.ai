id: ingest_usda_foundation
namespace: foodmind
description: Stream USDA Foundation Foods to durable GCS Parquet and Elasticsearch.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: download_archive
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT30M
    waitRunning: PT2H
    retry: {type: constant, interval: PT1M, maxAttempts: 3}
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python /workspace/cmd/ingestion.py stage usda-foundation download
              --foundation-path /data/foundations.json.zip
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
            limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 3Gi}
          volumeMounts: [{name: state, mountPath: /dlt}]
      volumes: [{name: state, emptyDir: {sizeLimit: 1Gi}}]

  - id: process_parquet_batches
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT30M
    waitRunning: PT6H
    retry: {type: constant, interval: PT1M, maxAttempts: 3}
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python /workspace/cmd/ingestion.py stage usda-foundation process
              --source-batch-size 25000 --foundation-path /data/foundations.json.zip
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 750m, memory: 2Gi, ephemeral-storage: 2Gi}
            limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 6Gi}
          volumeMounts: [{name: state, mountPath: /dlt}]
      volumes: [{name: state, emptyDir: {sizeLimit: 2Gi}}]

  - id: index_elasticsearch
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT30M
    waitRunning: PT4H
    retry: {type: constant, interval: PT1M, maxAttempts: 3}
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python /workspace/cmd/ingestion.py stage usda-foundation index
              --batch-size 1000 --foundation-path /data/foundations.json.zip
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi}
            limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 4Gi}
          volumeMounts: [{name: state, mountPath: /dlt}]
      volumes: [{name: state, emptyDir: {sizeLimit: 1Gi}}]

  - id: validate_counts
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: foodmind
    waitUntilRunning: PT30M
    waitRunning: PT1H
    # Validation failures are deterministic; retrying cannot change the candidate.
    retry: {type: constant, interval: PT1M, maxAttempts: 1}
    spec:
      serviceAccountName: foodmind
      restartPolicy: Never
      containers:
        - name: ingestion
          image: "{{ envs.foodmind_ingestion_image }}"
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python /workspace/cmd/ingestion.py stage usda-foundation validate
              --batch-size 1000 --foundation-path /data/foundations.json.zip
              --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging
          envFrom: [{secretRef: {name: foodmind-runtime}}]
          env:
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          resources:
            requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi}
            limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}
          volumeMounts: [{name: state, mountPath: /dlt}]
      volumes: [{name: state, emptyDir: {sizeLimit: 1Gi}}]
