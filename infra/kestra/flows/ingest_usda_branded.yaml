id: ingest_usda_branded
namespace: foodmind
description: Persist USDA Branded Foods as durable GCS Parquet, then index Elasticsearch.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: usda_branded_pipeline
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: download_archive
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - >-
            cd /workspace && python /workspace/cmd/ingestion.py stage usda-branded download
            --branded-path /data/branded.json.zip
            --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging

      - id: process_parquet_batches
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - >-
            cd /workspace && python /workspace/cmd/ingestion.py stage usda-branded process
            --source-batch-size 2000
            --branded-path /data/branded.json.zip
            --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging

      - id: index_elasticsearch
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - >-
            cd /workspace && python /workspace/cmd/ingestion.py stage usda-branded index
            --batch-size 500
            --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging

      - id: validate_counts
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - >-
            cd /workspace && python /workspace/cmd/ingestion.py stage usda-branded validate
            --batch-size 500
            --pipelines-dir /dlt/pipelines --staging-dir /dlt/staging

pluginDefaults:
  - type: io.kestra.plugin.scripts.shell.Commands
    values:
      taskRunner:
        type: io.kestra.plugin.core.runner.Process
