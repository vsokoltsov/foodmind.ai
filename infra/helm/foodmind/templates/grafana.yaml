{{- if or (eq .Values.component "all") (eq .Values.component "grafana") }}
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: FoodMind
        folder: FoodMind
        type: file
        options: {path: /var/lib/grafana/dashboards}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-foodmind-overview}
data:
  foodmind-overview.json: |-
{{ .Files.Get "files/grafana/foodmind-overview.json" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grafana-data}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.className | quote }}
  resources: {requests: {storage: {{ .Values.storage.grafanaSize | quote }}}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app.kubernetes.io/component: grafana}
  ports: [{name: http, port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/component: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/component: grafana}}
    spec:
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: grafana
          image: {{ .Values.images.grafana | quote }}
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - {name: provisioning, configMap: {name: grafana-provisioning}}
        - {name: dashboard, configMap: {name: grafana-dashboard-foodmind-overview}}
        - {name: data, persistentVolumeClaim: {claimName: grafana-data}}
{{- end }}
