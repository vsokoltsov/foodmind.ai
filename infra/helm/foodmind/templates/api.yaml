{{- if or (eq .Values.component "all") (eq .Values.component "api") }}
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "foodmind.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "foodmind.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "foodmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  # This low-cost cluster has one node, so an extra surge pod cannot be
  # scheduled during an update. Keep one replica available while replacing
  # the other one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "foodmind.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "foodmind.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: foodmind
      containers:
        - name: api
          image: {{ required "images.api is required" .Values.images.api | quote }}
          command: ["uvicorn", "app.api.middleware:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{secretRef: {name: {{ .Values.runtimeSecretName | quote }}}}]
          env:
            - {name: OTEL_SERVICE_NAME, value: foodmind-api}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://tempo:4318}
            - {name: NATS_URL, value: nats://nats:4222}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
        - name: cloud-sql-proxy
          image: {{ .Values.images.cloudSqlProxy | quote }}
          args: ["--address=0.0.0.0", "--port=5432", "--private-ip", {{ required "cloudSql.instanceConnectionName is required" .Values.cloudSql.instanceConnectionName | quote }}]
          securityContext: {runAsNonRoot: true}
{{- end }}
