apiVersion: v1
kind: Service
metadata:
  name: chat-worker
  labels:
    {{- include "foodmind.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "foodmind.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-worker
  labels:
    {{- include "foodmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  # The worker is single-replica and consumes a durable command stream. Avoid
  # an unschedulable surge pod on the one-node cluster during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "foodmind.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "foodmind.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: foodmind
      containers:
        - name: chat-worker
          image: {{ required "images.api is required" .Values.images.api | quote }}
          command: ["faststream", "run", "cmd.chat_worker:app", "--app-dir", "/app"]
          ports: [{name: metrics, containerPort: 9100}]
          envFrom: [{secretRef: {name: {{ .Values.runtimeSecretName | quote }}}}]
          env:
            - {name: OTEL_SERVICE_NAME, value: foodmind-chat-worker}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://tempo:4318}
            - {name: NATS_URL, value: nats://nats:4222}
          readinessProbe: {httpGet: {path: /metrics, port: metrics}, initialDelaySeconds: 15}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
        - name: cloud-sql-proxy
          image: {{ .Values.images.cloudSqlProxy | quote }}
          args: ["--address=0.0.0.0", "--port=5432", "--private-ip", {{ required "cloudSql.instanceConnectionName is required" .Values.cloudSql.instanceConnectionName | quote }}]
          securityContext: {runAsNonRoot: true}
