apiVersion: v1
kind: ServiceAccount
metadata:
  name: foodmind
  labels:
    {{- include "foodmind.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "gcpServiceAccount is required" .Values.gcpServiceAccount | quote }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
