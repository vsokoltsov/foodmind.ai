{{- if or (eq .Values.component "all") (eq .Values.component "kestra") }}
{{- $basicAuthUsername := default "admin@foodmind.local" .Values.kestra.basicAuthUsername }}
apiVersion: v1
kind: ConfigMap
metadata: {name: kestra-config}
data:
  application.yaml: |
    datasources:
      postgres:
        url: jdbc:postgresql://127.0.0.1:5432/kestra
        driver-class-name: org.postgresql.Driver
        username: ${KESTRA_POSTGRES_USER}
        password: ${KESTRA_POSTGRES_PASSWORD}
    kestra:
      server:
        basic-auth:
          username: ${KESTRA_BASIC_AUTH_USERNAME}
          password: ${KESTRA_BASIC_AUTH_PASSWORD}
      repository: {type: postgres}
      queue: {type: postgres}
      storage:
        type: gcs
        gcs:
          bucket: ${GCS_BUCKET}
      tasks:
        # Process-runner task directories live on the persistent task-data
        # volume. Keeping them on the container filesystem can evict Kestra
        # while large ingestion files are processed.
        tmp-dir: {path: /tmp/kestra-wd}
      url: ${KESTRA_URL}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kestra-task-data}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.className | quote }}
  resources:
    # ``default`` also supports upgrades of releases created before this
    # storage value was introduced with ``helm upgrade --reuse-values``.
    requests: {storage: {{ default "50Gi" .Values.storage.kestraTaskDataSize | quote }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kestra-ingestion-pods}
rules:
  # The Kubernetes task runner creates one short-lived pod per ingestion
  # stage, streams its logs, and removes it after completion. Keeping this
  # namespace-scoped avoids granting Kestra cluster-wide permissions.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kestra-ingestion-pods}
subjects:
  - kind: ServiceAccount
    name: foodmind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kestra-ingestion-pods
---
apiVersion: v1
kind: Service
metadata: {name: kestra}
spec:
  type: LoadBalancer
  {{- if .Values.public.kestraLoadBalancerIp }}
  loadBalancerIP: {{ .Values.public.kestraLoadBalancerIp | quote }}
  {{- end }}
  selector: {app.kubernetes.io/component: kestra}
  ports: [{name: http, port: 8080}, {name: management, port: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kestra}
spec:
  replicas: 1
  # Kestra is single-replica. Disallow a surge pod so its replacement fits on
  # the low-cost one-node GKE cluster.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector: {matchLabels: {app.kubernetes.io/component: kestra}}
  template:
    metadata: {labels: {app.kubernetes.io/component: kestra}}
    spec:
      serviceAccountName: foodmind
      # Keep the Cloud SQL proxy alive as a native sidecar while the migration
      # init container prepares Kestra's PostgreSQL schema. This is explicit
      # rather than relying on server startup behaviour, so a new database or
      # an upgraded Kestra image cannot start against a stale schema.
      initContainers:
        - name: cloud-sql-proxy
          image: {{ .Values.images.cloudSqlProxy | quote }}
          restartPolicy: Always
          args: ["--address=0.0.0.0", "--port=5432", "--private-ip", {{ required "cloudSql.instanceConnectionName is required" .Values.cloudSql.instanceConnectionName | quote }}]
          startupProbe:
            tcpSocket: {port: 5432}
            periodSeconds: 1
            failureThreshold: 30
          securityContext: {runAsNonRoot: true}
        - name: kestra-database-migrations
          image: {{ required "images.kestra is required" .Values.images.kestra | quote }}
          args: ["sys", "database", "migrate", "--config", "/etc/kestra/application.yaml", "--plugins", "/app/plugins"]
          envFrom: [{secretRef: {name: {{ .Values.runtimeSecretName | quote }}}}]
          env:
            - {name: KESTRA_URL, value: {{ .Values.public.kestraUrl | quote }}}
            - {name: KESTRA_BASIC_AUTH_USERNAME, value: {{ $basicAuthUsername | quote }}}
            - {name: KESTRA_BASIC_AUTH_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.runtimeSecretName | quote }}, key: KESTRA_BASIC_AUTH_PASSWORD}}}
            - {name: KESTRA_POSTGRES_USER, value: kestra}
            - {name: KESTRA_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.runtimeSecretName | quote }}, key: KESTRA_POSTGRES_PASSWORD}}}
          volumeMounts: [{name: config, mountPath: /etc/kestra}]
        # The Process task runner executes ingestion commands in the Kestra
        # pod. Prepare the persistent directories before that server starts,
        # so large raw downloads and dlt staging never consume node-local disk.
        - name: prepare-task-data
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /storage/data /storage/dlt /storage/tmp && chmod 0777 /storage/data /storage/dlt /storage/tmp
          volumeMounts: [{name: task-data, mountPath: /storage}]
      containers:
        - name: kestra
          image: {{ required "images.kestra is required" .Values.images.kestra | quote }}
          # Keep Kestra's image entrypoint (docker-entrypoint.sh). It prepares
          # the launcher before executing these server arguments.
          args: ["server", "standalone", "--config", "/etc/kestra/application.yaml", "--plugins", "/app/plugins"]
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 8081}]
          envFrom: [{secretRef: {name: {{ .Values.runtimeSecretName | quote }}}}]
          env:
            - {name: KESTRA_URL, value: {{ .Values.public.kestraUrl | quote }}}
            - {name: KESTRA_BASIC_AUTH_USERNAME, value: {{ $basicAuthUsername | quote }}}
            - {name: KESTRA_BASIC_AUTH_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.runtimeSecretName | quote }}, key: KESTRA_BASIC_AUTH_PASSWORD}}}
            - {name: KESTRA_POSTGRES_USER, value: kestra}
            - {name: KESTRA_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.runtimeSecretName | quote }}, key: KESTRA_POSTGRES_PASSWORD}}}
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
            # Flow definitions use this image for isolated Kubernetes task
            # pods. It contains the ingestion CLI and its Python dependencies.
            # Kestra only exposes variables prefixed with ENV_ to Pebble
            # expressions using its lower-case, underscore-separated name.
            - {name: ENV_FOODMIND_INGESTION_IMAGE, value: {{ required "images.kestra is required" .Values.images.kestra | quote }}}
          resources:
            {{- toYaml .Values.kestra.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/kestra}
            - {name: task-data, mountPath: /data, subPath: data}
            - {name: task-data, mountPath: /dlt, subPath: dlt}
            - {name: task-data, mountPath: /tmp/kestra-wd, subPath: tmp}
          readinessProbe: {tcpSocket: {port: management}, initialDelaySeconds: 20}
      volumes:
        - {name: config, configMap: {name: kestra-config}}
        - {name: task-data, persistentVolumeClaim: {claimName: kestra-task-data}}
{{- end }}
