apiVersion: v1
kind: ConfigMap
metadata: {name: kestra-config}
data:
  application.yaml: |
    datasources:
      postgres:
        url: jdbc:postgresql://127.0.0.1:5432/kestra
        driver-class-name: org.postgresql.Driver
        username: ${KESTRA_POSTGRES_USER}
        password: ${KESTRA_POSTGRES_PASSWORD}
    kestra:
      server:
        basic-auth:
          username: ${KESTRA_BASIC_AUTH_USERNAME}
          password: ${KESTRA_BASIC_AUTH_PASSWORD}
      repository: {type: postgres}
      queue: {type: postgres}
      storage:
        type: gcs
        gcs:
          bucket: ${GCS_BUCKET}
      tasks:
        tmp-dir: {path: /tmp/kestra-wd/tmp}
      url: ${KESTRA_URL}
---
apiVersion: v1
kind: Service
metadata: {name: kestra}
spec:
  type: LoadBalancer
  {{- if .Values.public.kestraLoadBalancerIp }}
  loadBalancerIP: {{ .Values.public.kestraLoadBalancerIp | quote }}
  {{- end }}
  selector: {app.kubernetes.io/component: kestra}
  ports: [{name: http, port: 8080}, {name: management, port: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kestra}
spec:
  replicas: 1
  # Kestra is single-replica. Disallow a surge pod so its replacement fits on
  # the low-cost one-node GKE cluster.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector: {matchLabels: {app.kubernetes.io/component: kestra}}
  template:
    metadata: {labels: {app.kubernetes.io/component: kestra}}
    spec:
      serviceAccountName: foodmind
      containers:
        - name: kestra
          image: {{ required "images.kestra is required" .Values.images.kestra | quote }}
          # Keep Kestra's image entrypoint (docker-entrypoint.sh). It prepares
          # the launcher before executing these server arguments.
          args: ["server", "standalone", "--config", "/etc/kestra/application.yaml", "--plugins", "/app/plugins"]
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 8081}]
          envFrom: [{secretRef: {name: {{ .Values.runtimeSecretName | quote }}}}]
          env:
            - {name: KESTRA_URL, value: {{ .Values.public.kestraUrl | quote }}}
            - {name: KESTRA_BASIC_AUTH_USERNAME, value: {{ .Values.kestra.basicAuthUsername | quote }}}
            - {name: KESTRA_BASIC_AUTH_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.runtimeSecretName | quote }}, key: KESTRA_BASIC_AUTH_PASSWORD}}}
            - {name: KESTRA_POSTGRES_USER, value: kestra}
            - {name: KESTRA_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.runtimeSecretName | quote }}, key: KESTRA_POSTGRES_PASSWORD}}}
            - {name: INGESTION_ARTIFACT_STORAGE, value: gcs}
            - {name: GCS_PREFIX, value: foodmind/ingestion}
          volumeMounts: [{name: config, mountPath: /etc/kestra}]
          readinessProbe: {tcpSocket: {port: management}, initialDelaySeconds: 20}
        - name: cloud-sql-proxy
          image: {{ .Values.images.cloudSqlProxy | quote }}
          args: ["--address=0.0.0.0", "--port=5432", "--private-ip", {{ required "cloudSql.instanceConnectionName is required" .Values.cloudSql.instanceConnectionName | quote }}]
          securityContext: {runAsNonRoot: true}
      volumes: [{name: config, configMap: {name: kestra-config}}]
