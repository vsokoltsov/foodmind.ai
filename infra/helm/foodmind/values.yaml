images:
  api: ""
  kestra: ""
  ingestion: ""
  nats: nats:2.11-alpine
  natsUi: ghcr.io/nats-nui/nui:latest
  grafana: grafana/grafana:12.0.2
  prometheus: prom/prometheus:v3.4.1
  tempo: grafana/tempo:2.8.2
  cloudSqlProxy: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.19.0

# Selects the part of the chart rendered by a component release.  "all" keeps
# local, single-release development compatible with the original deployment.
component: all

runtimeSecretName: foodmind-runtime
gcpServiceAccount: ""
cloudSql:
  instanceConnectionName: ""

api:
  # Cloud Run hosts the UI and the temporary MVP has a single small GKE node.
  # One API replica leaves headroom for an isolated ingestion pod.
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
worker:
  replicas: 1
  resources:
    # The worker can burst to two CPUs, but reserving 500m permanently blocks
    # the batch ingestion pod on an e2-standard-2 node.
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

kestra:
  basicAuthUsername: admin@foodmind.local
  flowDefinitionsConfigMap: kestra-flow-definitions
  resources:
    # Ingestion runs in isolated pods; these resources are only for the server.
    requests: {cpu: 250m, memory: 1536Mi, ephemeral-storage: 1Gi}
    limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 4Gi}

nats:
  resources:
    requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 1Gi}
natsUi:
  resources:
    requests: {cpu: 25m, memory: 64Mi, ephemeral-storage: 64Mi}
    limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}
grafana:
  # Expose Grafana through a cloud LoadBalancer. Set to ClusterIP when using
  # an ingress or port-forwarding-only access model.
  serviceType: LoadBalancer
  resources:
    requests: {cpu: 50m, memory: 256Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 500m, memory: 768Mi, ephemeral-storage: 1Gi}
prometheus:
  resources:
    requests: {cpu: 100m, memory: 512Mi, ephemeral-storage: 256Mi}
    limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
tempo:
  resources:
    requests: {cpu: 50m, memory: 256Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi}

public:
  apiEnabled: true
  apiHost: ""
  staticIpName: foodmind-api-ip
  managedCertificateName: foodmind-api-certificate
  kestraLoadBalancerIp: ""
  natsUiLoadBalancerIp: ""
  kestraUrl: http://kestra:8080/

storage:
  className: standard-rwo
  natsSize: 10Gi
  # Holds Kestra's own temporary Process-runner state. Data ingestion executes
  # in isolated pods and stores normalized data and checkpoints in GCS.
  kestraTaskDataSize: 50Gi
  grafanaSize: 5Gi
  prometheusSize: 20Gi
  tempoSize: 20Gi
