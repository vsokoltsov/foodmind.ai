global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: foodmind-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: foodmind-chat-worker
    static_configs:
      - targets: ["chat-worker:9100"]
