[project]
name = "foodmind-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "dlt[duckdb]>=1.29.1",
    "elasticsearch[async]>=9.5.0",
    "fastapi>=0.141.1",
    "faststream[cli,nats]>=0.7.5",
    "google-cloud-storage>=2.18.0",
    "httpx>=0.27.0",
    "ijson>=3.5.1",
    "nicegui>=3.16.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-ai>=0.4.0",
    "pydantic-settings[yaml]>=2.15.0",
    "tqdm>=4.67.1",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
markers = [
    "integration: tests that require Docker and external service containers",
    "evaluation: tests that call an LLM judge against a fixture catalog",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [".venv", ".dlt", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E731"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.16.5",
    "testcontainers[elasticsearch]>=4.15.0",
    "ty>=0.0.75",
]
