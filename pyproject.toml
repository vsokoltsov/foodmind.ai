[project]
name = "foodmind-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dlt[duckdb]>=1.29.1",
    "elasticsearch[async]>=9.5.0",
    "google-cloud-storage>=2.18.0",
    "httpx>=0.27.0",
    "ijson>=3.5.1",
    "pydantic>=2.8.0",
    "pydantic-ai>=0.4.0",
    "pydantic-settings>=2.15.0",
    "tqdm>=4.67.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
markers = [
    "integration: tests that require Docker and external service containers",
    "evaluation: tests that call an LLM judge against a fixture catalog",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [".venv", ".dlt", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E731"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.16.5",
    "testcontainers[elasticsearch]>=4.15.0",
    "ty>=0.0.75",
]
